[log]
level = error
[log.frontend]
enabled = false
provider = grafana

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[auth.basic]
enabled = false

[auth.anonymous]
enabled = true
org_role = Admin

[security]
disable_gravatar=true
angular_support_enabled=false

[explore]
enabled = true

[users]
default_theme = dark

[metrics]
enabled = true
disable_total_stats = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/windows/windows_fleet_overview.json

[rendering]
# Using Grafana 13 built-in Chromium rendering
server_url = http://grafana-image-renderer:8081/render
renderer_token = my-secret-token
rendering_args = no-sandbox,disable-gpu,disable-dev-shm-usage
rendering_mode = clustered
